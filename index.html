<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d5fa6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Around Me</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f6f6f2; --surface: #ffffff; --ink: #16233b; --muted: #5d6676; --line: #dfe1dc;
  --accent: #1d5fa6; --accent-soft: #e3ecf7; --shadow: 0 6px 24px rgba(22,35,59,.18);
  --c-sight: #b97a1c; --c-eat: #c2410c; --c-cafe: #8b5e34; --c-drink: #7c3aed; --c-view: #0e8a6b;
  --display: "Young Serif", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1520; --surface: #172030; --ink: #e9ecf1; --muted: #9aa4b4; --line: #273246;
    --accent: #7fb0ea; --accent-soft: #1c2c44; --shadow: 0 6px 24px rgba(0,0,0,.5);
    --c-sight: #e0a64d; --c-eat: #f97352; --c-cafe: #d2a36f; --c-drink: #a78bfa; --c-view: #34d3a6;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; overflow: hidden; }
#map { position: fixed; inset: 0; background: var(--bg); }
.leaflet-container { font-family: var(--body); background: var(--bg); }
.leaflet-control-attribution { font-size: 10px; }
@media (prefers-color-scheme: dark) {
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6); }
}

/* top bar */
.top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  display: grid; gap: 8px;
}
.top > * { pointer-events: auto; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; justify-self: start; max-width: 100%; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: .85rem; font-weight: 600;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
  box-shadow: var(--shadow); cursor: pointer;
}
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: block; }
.chip[aria-pressed="false"] { opacity: .55; box-shadow: none; }
.banner {
  justify-self: center; background: var(--ink); color: var(--bg); font-size: .82rem; font-weight: 600;
  padding: 6px 14px; border-radius: 999px; box-shadow: var(--shadow); max-width: 100%; text-align: center;
}
.searchhere {
  justify-self: center; font: inherit; font-weight: 700; font-size: .85rem; color: var(--bg); background: var(--accent);
  border: none; border-radius: 999px; padding: 8px 16px; box-shadow: var(--shadow); cursor: pointer;
}

/* floating buttons */
.fab {
  position: fixed; z-index: 1000; right: max(12px, env(safe-area-inset-right, 0px));
  width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--accent);
  box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer;
}
.fab svg { width: 24px; height: 24px; }
.fab.following { background: var(--accent); color: var(--surface); border-color: var(--accent); }

/* bottom sheet */
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 1001; background: var(--surface); color: var(--ink);
  border-radius: 18px 18px 0 0; box-shadow: var(--shadow); display: flex; flex-direction: column;
  max-height: 46vh; transition: max-height .25s ease; max-width: 640px; margin: 0 auto;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet.open { max-height: 78vh; }
.sheet.min { max-height: 64px; }
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
.handle {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  border: none; background: none; font: inherit; color: inherit; cursor: pointer; text-align: left; width: 100%;
}
.handle::before { content: ""; position: absolute; left: 50%; top: 6px; width: 36px; height: 4px; border-radius: 2px; background: var(--line); transform: translateX(-50%); }
.handle h2 { font-family: var(--display); font-weight: 400; font-size: 1.1rem; margin: 6px 0 0; }
.handle span { font-size: .8rem; color: var(--muted); white-space: nowrap; margin-top: 6px; }
.body { overflow-y: auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); -webkit-overflow-scrolling: touch; }

.list { list-style: none; margin: 0; padding: 0; display: grid; }
.row {
  display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; padding: 10px 0;
  border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0;
  font: inherit; color: inherit; text-align: left; width: 100%;
}
.row:first-child { border-top: 0; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
.row b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row small { color: var(--muted); font-size: .8rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .dist { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row > div { min-width: 0; }
.empty { color: var(--muted); font-size: .9rem; padding: 8px 0 4px; }

/* detail */
.detail { display: grid; gap: 10px; }
.back { justify-self: start; font: inherit; font-size: .85rem; font-weight: 600; color: var(--accent); background: none; border: none; padding: 0; cursor: pointer; }
.detail img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 12px; background: var(--line); }
.kind { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--c); }
.detail h3 { font-family: var(--display); font-weight: 400; font-size: 1.4rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.detail p { margin: 0; max-width: 62ch; }
.facts { display: grid; gap: 4px; font-size: .9rem; }
.facts div { display: grid; grid-template-columns: 96px 1fr; gap: 8px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: .9rem; font-weight: 600; text-decoration: none;
  padding: 9px 14px; border-radius: 12px; border: 1px solid var(--line); color: var(--ink); background: var(--bg);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.src { font-size: .75rem; color: var(--muted); }
.src a { color: inherit; }

/* map markers */
.me-wrap { position: relative; width: 120px; height: 120px; pointer-events: none; }
.cone {
  position: absolute; inset: 0; border-radius: 50%; transform: rotate(var(--h, 0deg));
  background: conic-gradient(from -30deg, rgba(43,123,240,.42) 0deg 60deg, transparent 60deg 360deg);
  -webkit-mask: radial-gradient(circle, #000 0 30%, rgba(0,0,0,.6) 45%, transparent 50%);
          mask: radial-gradient(circle, #000 0 30%, rgba(0,0,0,.6) 45%, transparent 50%);
}
.me { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 18px; height: 18px; border-radius: 50%; background: #2b7bf0; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(43,123,240,.35), 0 2px 6px rgba(0,0,0,.3); }
.fab.ahead { right: auto; left: max(12px, env(safe-area-inset-left, 0px)); width: auto; padding: 0 14px; gap: 6px; display: inline-flex; align-items: center; font: inherit; font-size: .85rem; font-weight: 700; }
.fab.ahead[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>

<div class="top">
  <div class="chips" id="chips" role="group" aria-label="What to show"></div>
  <div class="banner" id="banner" hidden></div>
  <button class="searchhere" id="searchHere" type="button" hidden>Search this area</button>
</div>

<button class="fab" id="locate" type="button" aria-label="Center on my position" title="Center on me">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>

<button class="fab ahead" id="ahead" type="button" aria-pressed="false" title="Show only what's in front of you">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
  <span id="aheadLabel">Ahead of me</span>
</button>

<section class="sheet" id="sheet">
  <button class="handle" id="handle" type="button" aria-expanded="false">
    <h2 id="sheetTitle">Around you</h2>
    <span id="sheetMeta">Finding you…</span>
  </button>
  <div class="body" id="body"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  const CATS = {
    sight: { label: "Sights",          var: "--c-sight" },
    eat:   { label: "Eat",             var: "--c-eat" },
    cafe:  { label: "Coffee & sweets", var: "--c-cafe" },
    drink: { label: "Drinks",          var: "--c-drink" },
    view:  { label: "Views & beaches", var: "--c-view" },
  };
  const FALLBACK = [38.5347, -0.1310]; // Benidorm old town (Balcó del Mediterrani)
  const MIN_ZOOM_FETCH = 14;
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- state
  const enabled = new Set(Object.keys(CATS));
  try { const s = JSON.parse(localStorage.getItem("am-cats")); if (Array.isArray(s) && s.length) { enabled.clear(); s.forEach((k) => CATS[k] && enabled.add(k)); } } catch {}
  const places = new Map(); // id -> place
  let me = null, following = true, selected = null, fetchedBounds = [], loading = 0;

  // ---------- map
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const map = L.map("map", { zoomControl: false, attributionControl: true }).setView(FALLBACK, 16);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Wikipedia',
  }).addTo(map);
  const layer = L.layerGroup().addTo(map);
  let meMarker = null, meCircle = null;

  // ---------- chips
  function renderChips() {
    const wrap = $("chips"); wrap.textContent = "";
    for (const [k, c] of Object.entries(CATS)) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.style.setProperty("--c", `var(${c.var})`);
      b.setAttribute("aria-pressed", String(enabled.has(k)));
      b.innerHTML = `<i></i>${esc(c.label)}`;
      b.onclick = () => {
        enabled.has(k) ? enabled.delete(k) : enabled.add(k);
        if (!enabled.size) enabled.add(k);
        try { localStorage.setItem("am-cats", JSON.stringify([...enabled])); } catch {}
        renderChips(); render();
      };
      wrap.append(b);
    }
  }
  renderChips();

  // ---------- helpers
  function distM(a, b) {
    const R = 6371000, toR = Math.PI / 180;
    const dLa = (b[0] - a[0]) * toR, dLo = (b[1] - a[1]) * toR;
    const x = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * toR) * Math.cos(b[0] * toR) * Math.sin(dLo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function fmtDist(m) {
    if (m < 1000) return `${Math.round(m / 10) * 10} m · ${Math.max(1, Math.round(m / 80))} min`;
    if (m < 3000) return `${(m / 1000).toFixed(1)} km · ${Math.round(m / 80)} min`;
    return `${(m / 1000).toFixed(1)} km`;
  }
  const origin = () => me || [map.getCenter().lat, map.getCenter().lng];
  function banner(text, ms) {
    const b = $("banner"); b.textContent = text; b.hidden = !text;
    clearTimeout(banner.t); if (text && ms) banner.t = setTimeout(() => (b.hidden = true), ms);
  }
  function setLoading(d) {
    loading += d;
    if (loading > 0) $("sheetMeta").textContent = "Looking around…"; else render();
  }

  // ---------- data: OpenStreetMap (Overpass)
  const OVERPASS = ["https://overpass-api.de/api/interpreter"];
  function catFromTags(t) {
    if (t.amenity === "restaurant") return "eat";
    if (t.amenity === "cafe" || t.amenity === "ice_cream" || t.shop === "bakery" || t.shop === "pastry") return "cafe";
    if (t.amenity === "bar" || t.amenity === "pub") return "drink";
    if (t.tourism === "viewpoint" || t.natural === "beach") return "view";
    if (t.tourism || t.historic) return "sight";
    return null;
  }
  const KIND = {
    restaurant: "Restaurant", cafe: "Café", ice_cream: "Ice cream", bakery: "Bakery", pastry: "Pastry shop", bar: "Bar", pub: "Pub",
    viewpoint: "Viewpoint", beach: "Beach", museum: "Museum", attraction: "Attraction", castle: "Castle", monument: "Monument",
    ruins: "Ruins", archaeological_site: "Archaeological site", city_gate: "Old town gate", tower: "Tower", fort: "Fort", church: "Church",
  };
  async function fetchOSM(b) {
    const bb = `${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;
    const q = `[out:json][timeout:25];(
      nwr["amenity"~"^(restaurant|cafe|bar|pub|ice_cream)$"]["name"](${bb});
      nwr["shop"~"^(bakery|pastry)$"]["name"](${bb});
      nwr["tourism"="viewpoint"](${bb});
      nwr["natural"="beach"]["name"](${bb});
      nwr["tourism"~"^(museum|attraction)$"]["name"](${bb});
      nwr["historic"~"^(castle|monument|ruins|archaeological_site|city_gate|tower|fort|church)$"]["name"](${bb});
    );out center tags 400;`;
    // The full query server is often overloaded, so the quicker search service runs alongside it.
    const overpass = (async () => {
      const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 15000);
      try {
        const r = await fetch(OVERPASS[0], { method: "POST", signal: ctl.signal, body: "data=" + encodeURIComponent(q), headers: { "Content-Type": "application/x-www-form-urlencoded" } });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const j = await r.json();
        for (const e of j.elements || []) {
          const lat = e.lat ?? e.center?.lat, lon = e.lon ?? e.center?.lon;
          addOSM("osm-" + e.type + e.id, lat, lon, e.tags || {});
        }
        render();
      } finally { clearTimeout(timer); }
    })();
    const results = await Promise.allSettled([overpass, fetchNominatim(b.pad(-0.3))]);
    if (results.every((r) => r.status === "rejected")) throw new Error("No place data");
  }
  function addOSM(id, lat, lon, t) {
    const cat = catFromTags(t);
    if (!cat || lat == null) return;
    const type = t.amenity || t.shop || t.tourism || t.historic || t.natural;
    places.set(id, {
      id, cat, lat: +lat, lon: +lon, src: "osm", tags: t,
      name: t.name || t["name:en"] || KIND[type] || "Viewpoint",
      kind: KIND[type] || type, wiki: t.wikipedia || null,
      sub: [KIND[type] || type, t.cuisine && t.cuisine.replace(/_/g, " ").replace(/;/g, ", ")].filter(Boolean).join(" · "),
    });
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  async function fetchNominatim(b) {
    const vb = `${b.getWest()},${b.getNorth()},${b.getEast()},${b.getSouth()}`;
    let ok = 0;
    for (const term of ["restaurant", "cafe", "bar", "ice cream", "viewpoint", "beach"]) {
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(term)}&viewbox=${vb}&bounded=1&format=jsonv2&limit=40&extratags=1&accept-language=en`);
        if (r.ok) {
          ok++;
          for (const x of await r.json()) {
            const t = { ...(x.extratags || {}), [x.category]: x.type };
            if (x.name) t.name = x.name;
            addOSM("osm-" + x.osm_type + x.osm_id, x.lat, x.lon, t);
          }
          render();
        }
      } catch {}
      await sleep(1100);
    }
    if (!ok) throw new Error("No place data");
  }

  // ---------- data: Wikipedia (sights with stories)
  // Articles that have coordinates but aren't something you can go and look at
  const NOT_A_PLACE = /\b(municipality|municipio|city in|town in|village in|comarca|province|district of|championships?|season|festival|election|club|football|tournament|race|edition|event|album|film|company|airline|hotel|apartment|residential|census|parish|neighbou?rhood|barrio|partido|ciudad|localidad|campeonato|temporada)\b/i;
  async function fetchWiki(b) {
    const c = b.getCenter();
    const radius = Math.min(10000, Math.max(500, Math.round(c.distanceTo(b.getNorthEast()))));
    for (const lang of ["en", "es"]) {
      const u = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=geosearch&ggscoord=${c.lat}|${c.lng}&ggsradius=${radius}&ggslimit=40&prop=coordinates|pageimages|description&piprop=thumbnail&pithumbsize=500`;
      const r = await fetch(u); if (!r.ok) continue;
      const j = await r.json();
      for (const p of Object.values(j.query?.pages || {})) {
        const co = p.coordinates?.[0]; if (!co) continue;
        if (NOT_A_PLACE.test(p.description || "") || NOT_A_PLACE.test(p.title)) continue;
        const key = (lang + ":" + p.title).toLowerCase();
        // skip if English already covers a place at practically the same spot
        if (lang === "es" && [...places.values()].some((x) => x.src === "wiki" && distM([x.lat, x.lon], [co.lat, co.lon]) < 40)) continue;
        places.set("wiki-" + key, {
          id: "wiki-" + key, cat: "sight", lat: co.lat, lon: co.lon, src: "wiki", lang, title: p.title,
          name: p.title, sub: p.description || "Wikipedia article", kind: "From Wikipedia", thumb: p.thumbnail?.source || null,
        });
      }
    }
  }

  function covered(b) { return fetchedBounds.some((f) => f.contains(b)); }
  let pending = null, inflight = false, again = false;
  async function loadArea(force) {
    if (inflight) { again = true; return; }
    inflight = true;
    try { await loadAreaNow(force); } finally {
      inflight = false;
      if (again) { again = false; if (!covered(map.getBounds())) loadArea(); }
    }
  }
  async function loadAreaNow(force) {
    const b = map.getBounds();
    if (map.getZoom() < MIN_ZOOM_FETCH) { $("searchHere").hidden = true; banner("Zoom in to see places", 0); render(); return; }
    banner("");
    if (!force && covered(b)) { render(); return; }
    $("searchHere").hidden = true;
    const big = b.pad(0.35);
    setLoading(1);
    const results = await Promise.allSettled([fetchOSM(big), fetchWiki(big)]);
    setLoading(-1);
    if (results[0].status === "rejected") banner("Couldn't load restaurants and cafés right now. Try again in a moment.", 6000);
    if (results.every((r) => r.status === "fulfilled")) fetchedBounds.push(big);
    // de-duplicate OSM sights that are the same as a Wikipedia article
    for (const p of [...places.values()]) {
      if (p.src === "osm" && p.wiki) {
        const k = "wiki-" + p.wiki.toLowerCase();
        if (places.has(k)) { places.get(k).osm = p; places.delete(p.id); }
      }
    }
    render();
  }
  map.on("moveend", () => {
    clearTimeout(pending);
    pending = setTimeout(() => {
      if (map.getZoom() >= MIN_ZOOM_FETCH && !covered(map.getBounds())) loadArea();
      else if (map.getZoom() < MIN_ZOOM_FETCH) loadArea();
      else render();
    }, 500);
  });
  map.on("dragstart", () => { following = false; $("locate").classList.remove("following"); });
  $("searchHere").onclick = () => loadArea(true);

  // ---------- render markers + list
  // ---------- compass ("what am I looking at?")
  const HALF_CONE = 35, AHEAD_MAX_M = 2500;
  let heading = null, ahead = false, lastHeading = null, listening = false, rt = null;
  function bearing(a, b) {
    const toR = Math.PI / 180, dLo = (b[1] - a[1]) * toR;
    const y = Math.sin(dLo) * Math.cos(b[0] * toR);
    const x = Math.cos(a[0] * toR) * Math.sin(b[0] * toR) - Math.sin(a[0] * toR) * Math.cos(b[0] * toR) * Math.cos(dLo);
    return (Math.atan2(y, x) / toR + 360) % 360;
  }
  const angDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);
  const dirName = (h) => ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(h / 45) % 8];
  const aheadActive = () => ahead && heading != null;
  function throttledRender() { if (rt) return; rt = setTimeout(() => { rt = null; if (!selected) render(); }, 400); }
  function onOrient(e) {
    let h = null;
    if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading;           // iPhone
    else if (e.absolute && typeof e.alpha === "number") h = 360 - e.alpha;                 // Android
    if (h == null || isNaN(h)) return;
    h = (h + ((screen.orientation && screen.orientation.angle) || window.orientation || 0) + 360) % 360;
    heading = heading == null ? h : (heading + (((h - heading + 540) % 360) - 180) * 0.25 + 360) % 360; // smooth
    const cone = document.querySelector(".cone");
    if (cone) { cone.hidden = false; cone.style.setProperty("--h", heading.toFixed(1) + "deg"); }
    if (ahead) {
      $("aheadLabel").textContent = "Facing " + dirName(heading);
      if (lastHeading == null || angDiff(heading, lastHeading) > 8) { lastHeading = heading; throttledRender(); }
    }
  }
  const needsIOSPermission = () => window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function";
  function listenCompass() {
    if (listening) return; listening = true;
    if ("ondeviceorientationabsolute" in window) addEventListener("deviceorientationabsolute", onOrient);
    else addEventListener("deviceorientation", onOrient);
  }
  if (!needsIOSPermission()) listenCompass(); // Android starts right away; iPhone needs a tap first
  $("ahead").onclick = async () => {
    if (!ahead && needsIOSPermission() && !listening) {
      try {
        if ((await DeviceOrientationEvent.requestPermission()) !== "granted") { banner("Compass access was declined. Reload the page to be asked again.", 7000); return; }
      } catch { banner("Couldn't start the compass.", 5000); return; }
      listenCompass();
    }
    ahead = !ahead;
    $("ahead").setAttribute("aria-pressed", String(ahead));
    $("aheadLabel").textContent = ahead && heading != null ? "Facing " + dirName(heading) : "Ahead of me";
    if (ahead && heading == null) banner("Waiting for the compass. This only works on a phone.", 5000);
    if (ahead && me) { following = true; $("locate").classList.add("following"); map.setView(me, Math.max(map.getZoom(), 16)); }
    lastHeading = heading;
    if (selected) closeDetail(); else render();
  };

  function visiblePlaces() {
    const b = map.getBounds(), o = origin(), aa = aheadActive();
    return [...places.values()]
      .filter((p) => enabled.has(p.cat))
      .map((p) => ({ ...p, d: distM(o, [p.lat, p.lon]), brg: bearing(o, [p.lat, p.lon]) }))
      .filter((p) => aa ? p.d <= AHEAD_MAX_M : b.contains([p.lat, p.lon]))
      .map((p) => ({ ...p, inCone: !aa || p.d < 25 || angDiff(p.brg, heading) <= HALF_CONE }))
      .sort((a, b) => a.d - b.d);
  }
  function render() {
    layer.clearLayers();
    const all = visiblePlaces();
    const vis = all.filter((p) => p.inCone);
    for (const p of all) {
      const isSel = selected && selected.id === p.id;
      const m = L.circleMarker([p.lat, p.lon], {
        radius: isSel ? 11 : p.src === "wiki" ? 8 : 6.5, weight: isSel ? 4 : 2, color: dark ? "#0f1520" : "#ffffff",
        fillColor: css(CATS[p.cat].var), fillOpacity: p.inCone ? 1 : 0.25, opacity: p.inCone ? 1 : 0.3,
      }).addTo(layer);
      m.bindTooltip(p.name, { direction: "top", offset: [0, -6] });
      m.on("click", () => openDetail(p.id));
    }
    if (selected) return;
    $("sheetTitle").textContent = aheadActive() ? `Ahead of you · ${dirName(heading)}` : me ? "Around you" : "In this area";
    $("sheetMeta").textContent = loading > 0 ? "Looking around…"
      : map.getZoom() < MIN_ZOOM_FETCH && !aheadActive() ? "Zoom in"
      : `${vis.length} place${vis.length === 1 ? "" : "s"}${aheadActive() ? " in view" : " on the map"}`;
    const body = $("body");
    if (!vis.length) {
      if (loading > 0) { body.innerHTML = '<p class="empty">Looking around…</p>'; return; }
      body.innerHTML = `<p class="empty">${aheadActive() ? "Nothing in that direction for the filters you picked. Turn a little, or turn on more categories."
        : map.getZoom() < MIN_ZOOM_FETCH ? "Zoom in on a town to see what's there."
        : "Nothing here for the filters you picked. Try moving the map or turning on more categories."}</p>`;
      return;
    }
    const ul = document.createElement("div"); ul.className = "list";
    for (const p of vis.slice(0, 80)) {
      const r = document.createElement("button");
      r.type = "button"; r.className = "row"; r.style.setProperty("--c", `var(${CATS[p.cat].var})`);
      r.innerHTML = `<span class="dot"></span><div><b>${esc(p.name)}</b><small>${esc(p.sub || CATS[p.cat].label)}</small></div><span class="dist">${fmtDist(p.d)}</span>`;
      r.onclick = () => openDetail(p.id, true);
      ul.append(r);
    }
    body.textContent = ""; body.append(ul);
  }

  // ---------- detail view
  const prettyHours = (h) => h.replace(/;\s*/g, "\n").replace(/Mo/g, "Mon").replace(/Tu/g, "Tue").replace(/We/g, "Wed").replace(/Th/g, "Thu").replace(/Fr/g, "Fri").replace(/Sa/g, "Sat").replace(/Su/g, "Sun").replace(/PH/g, "Holidays").replace(/\boff\b/g, "closed");
  async function wikiSummary(lang, title) {
    try {
      const r = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g, "_"))}`);
      if (!r.ok) return null; return await r.json();
    } catch { return null; }
  }
  async function openDetail(id, pan) {
    const p = places.get(id); if (!p) return;
    selected = p;
    const sheet = $("sheet"); sheet.classList.remove("min"); sheet.classList.add("open"); $("handle").setAttribute("aria-expanded", "true");
    if (pan) map.panTo([p.lat, p.lon]);
    following = false; $("locate").classList.remove("following");
    render();
    const d = distM(origin(), [p.lat, p.lon]);
    $("sheetTitle").textContent = CATS[p.cat].label;
    $("sheetMeta").textContent = me ? fmtDist(d) + " away" : "";
    const t = p.tags || p.osm?.tags || {};
    const facts = [];
    if (t.cuisine) facts.push(["Cuisine", t.cuisine.replace(/_/g, " ").replace(/;/g, ", ")]);
    if (t.opening_hours) facts.push(["Hours", prettyHours(t.opening_hours)]);
    if (t.outdoor_seating === "yes") facts.push(["Terrace", "Outdoor seating"]);
    if (t.phone || t["contact:phone"]) facts.push(["Phone", t.phone || t["contact:phone"]]);
    const site = t.website || t["contact:website"];
    const gq = encodeURIComponent(p.name);
    const ask = `I'm at ${p.name} (${p.kind || CATS[p.cat].label}) at coordinates ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)} on the Costa Blanca in Spain. ` +
      (p.cat === "sight" || p.cat === "view" ? "Tell me the story of this place and what I shouldn't miss here." : "Is it any good, what should I order, and are there better options within a short walk?");
    $("body").innerHTML = `
      <div class="detail" style="--c: var(${CATS[p.cat].var})">
        <button class="back" type="button" id="back">← All places</button>
        <img id="dImg" alt="" hidden>
        <div><div class="kind">${esc(p.kind || CATS[p.cat].label)}</div><h3>${esc(p.name)}</h3></div>
        <p id="dText">${p.src === "wiki" || p.wiki ? '<span class="src">Loading the story…</span>' : ""}</p>
        ${facts.length ? `<dl class="facts">${facts.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd style="white-space:pre-line">${esc(v)}</dd></div>`).join("")}</dl>` : ""}
        <div class="actions">
          <a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=walking">Walk there</a>
          <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/${gq}/@${p.lat},${p.lon},18z">Reviews & photos</a>
          <a class="btn" target="_blank" rel="noopener" href="https://claude.ai/new?q=${encodeURIComponent(ask)}">Ask Claude</a>
          ${site ? `<a class="btn" target="_blank" rel="noopener" href="${esc(/^https?:/i.test(site) ? site : "https://" + site)}">Website</a>` : ""}
        </div>
        <div class="src" id="dSrc">${p.src === "osm" ? 'Details from <a target="_blank" rel="noopener" href="https://www.openstreetmap.org/">OpenStreetMap</a>. Check hours on Google before you go.' : ""}</div>
      </div>`;
    $("back").onclick = closeDetail;
    $("body").scrollTop = 0;
    if (p.thumb) { $("dImg").src = p.thumb; $("dImg").hidden = false; }
    let lang = p.lang, title = p.title;
    if (!title && p.wiki) { const m = p.wiki.match(/^([a-z]{2,3}):(.+)$/); if (m) { lang = m[1]; title = m[2]; } }
    if (title) {
      const s = await wikiSummary(lang, title);
      if (selected !== p) return;
      if (s) {
        $("dText").textContent = s.extract || "";
        if (!p.thumb && s.thumbnail?.source) { $("dImg").src = s.thumbnail.source; $("dImg").hidden = false; }
        $("dSrc").innerHTML = `From <a target="_blank" rel="noopener" href="${esc(s.content_urls?.mobile?.page || "")}">Wikipedia${lang === "es" ? " (Spanish)" : ""}</a>. Tap to read the full article.`;
      } else $("dText").textContent = "";
    }
  }
  function closeDetail() { selected = null; $("sheet").classList.remove("open"); render(); }
  map.on("click", () => { if (selected) closeDetail(); });

  $("handle").onclick = () => {
    const s = $("sheet");
    if (s.classList.contains("min")) { s.classList.remove("min"); }
    else if (s.classList.contains("open")) { s.classList.remove("open"); s.classList.add("min"); }
    else { s.classList.add("open"); }
    $("handle").setAttribute("aria-expanded", String(s.classList.contains("open")));
  };

  // ---------- my position
  function placeFab() { for (const id of ["locate", "ahead"]) $(id).style.bottom = `calc(${$("sheet").offsetHeight}px + 12px)`; }
  new ResizeObserver(placeFab).observe($("sheet"));
  $("locate").onclick = () => {
    following = true; $("locate").classList.add("following");
    if (me) map.setView(me, Math.max(map.getZoom(), 16)); else startGeo(true);
  };
  function onPos(pos) {
    const first = !me;
    me = [pos.coords.latitude, pos.coords.longitude];
    const acc = Math.min(pos.coords.accuracy || 30, 500);
    if (!meMarker) {
      meMarker = L.marker(me, { icon: L.divIcon({ className: "", html: `<div class="me-wrap"><div class="cone"${heading == null ? " hidden" : ` style="--h:${heading}deg"`}></div><div class="me"></div></div>`, iconSize: [120, 120], iconAnchor: [60, 60] }), interactive: false, zIndexOffset: 1000 }).addTo(map);
      meCircle = L.circle(me, { radius: acc, color: "#2b7bf0", weight: 1, fillOpacity: 0.08, interactive: false }).addTo(map);
    } else { meMarker.setLatLng(me); meCircle.setLatLng(me).setRadius(acc); }
    if (first || following) { map.setView(me, first ? 16 : map.getZoom()); $("locate").classList.add("following"); }
    banner("");
    if (!selected) render();
  }
  function onPosErr(err) {
    if (!me) {
      banner(err.code === 1 ? "Location is off. Showing Benidorm. Allow location to see what's around you." : "Can't find your position yet. Showing Benidorm.", 7000);
      $("sheetTitle").textContent = "In this area";
      loadArea();
    }
  }
  let watchId = null;
  function startGeo(userAsked) {
    if (!("geolocation" in navigator)) { onPosErr({ code: 2 }); return; }
    if (watchId != null && !userAsked) return;
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 15000, timeout: 15000 });
  }

  startGeo();
  loadArea();
  placeFab();
})();
</script>
</body>
</html>
